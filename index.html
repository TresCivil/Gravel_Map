<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravel Ops — Pit Map</title>
<link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css"/>
<script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js" async></script>
<style>
:root{
  --ink:#122043;--ink-soft:#3B4A6B;--muted:#6B7590;--faint:#9AA3BC;
  --line:#E4E7F0;--line-soft:#EEF0F6;--bg:#F4F5FA;--card:#FFFFFF;
  --violet:#6B4E9E;--violet-dark:#54397F;--violet-mid:#8168B4;--violet-tint:#F1ECFA;--violet-tint-2:#E7DEF5;
  --amber:#D98C1F;--amber-tint:#FBF0DD;--green:#25865A;--green-tint:#E4F5EC;
  --red:#C24545;--red-tint:#FBEAEA;--slate:#3B4E7A;--slate-tint:#E9EEF7;
  --radius:12px;
  /* Status colours */
  --st-notstarted:#27272A;--st-production:#EE7D1C;--st-completed:#214E47;--st-nostock:#C24545;--st-other:#7A8BA8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}

#app{height:100vh;display:grid;grid-template-rows:1fr;padding:16px;min-height:0}

/* Layout */
.map-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:16px;min-height:0}
.map-col{display:flex;flex-direction:column;min-height:0}
.map-wrap{position:relative;flex:1;min-height:300px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#E3EFE6}
#azureMap{position:absolute;inset:0}

/* Map overlays */
.style-toggle{position:absolute;top:12px;left:12px;z-index:10;display:flex;background:#fff;border-radius:8px;padding:3px;box-shadow:0 2px 10px rgba(14,31,61,.16)}
.style-btn{border:none;background:transparent;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);border-radius:6px}
.style-btn.active{background:var(--violet-tint);color:var(--violet-dark)}
.map-ctrls{position:absolute;bottom:14px;right:12px;z-index:10;display:flex;flex-direction:column;gap:8px}
.ctrl-group{display:flex;flex-direction:column;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.14);overflow:hidden}
.ctrl-group button{width:32px;height:32px;border:none;background:#fff;color:var(--ink-soft);font-size:17px;display:flex;align-items:center;justify-content:center}
.ctrl-group button + button{border-top:1px solid rgba(0,0,0,.08)}
.ctrl-group button:hover{background:var(--line-soft)}
.ctrl-group svg{width:15px;height:15px}
.map-caption{position:absolute;left:12px;bottom:12px;z-index:10;font-size:10.5px;color:var(--ink-soft);background:rgba(255,255,255,.85);padding:3px 10px;border-radius:20px}
#mapLoader{position:absolute;inset:0;z-index:20;background:rgba(244,245,250,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s}
#mapLoader.hidden{opacity:0;pointer-events:none}
.loader-text{font-size:11.5px;font-weight:600;color:var(--muted)}
.loader-track{width:180px;height:3px;background:var(--line);border-radius:4px;overflow:hidden}
.loader-fill{height:100%;background:linear-gradient(90deg,var(--violet-mid),var(--violet),var(--violet-mid));background-size:200% 100%;animation:slide 1.2s linear infinite}
@keyframes slide{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* Pins */
.pin{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;transition:transform .12s}
.pin:hover{transform:scale(1.3)}
.pin.selected{transform:scale(1.55);box-shadow:0 0 0 4px rgba(107,78,158,.35),0 1px 4px rgba(0,0,0,.35)}
.pin-label{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;pointer-events:none;display:none}
.pin-host:hover .pin-label,.pin-host.is-selected .pin-label{display:block}
.pin-host{position:relative}

.style-sep{width:1px;background:var(--line);margin:4px 3px}

/* Legend */
.map-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* Side panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.panel-title{font-size:14.5px;font-weight:600;color:var(--ink)}
.panel-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.panel-body{flex:1;overflow-y:auto;padding:0 12px 14px}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:#D5D9E5;border-radius:2px}

.pit-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.pit-item:last-child{border-bottom:none}
.pit-item:hover{background:var(--line-soft)}
.pit-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pit-text{flex:1;min-width:0}
.pit-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pit-meta{font-size:11px;color:var(--muted);margin-top:1px}
.pit-status{font-weight:600}
.pit-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nogps{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;color:var(--amber);background:var(--amber-tint);padding:1px 6px;border-radius:4px;vertical-align:1px}
.chev{width:14px;height:14px;color:var(--muted);flex-shrink:0}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 16px;color:var(--muted)}
.empty-title{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.empty-sub{font-size:11.5px;max-width:230px}

/* Detail */
.detail-back{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;margin:14px 18px 0;border:none;background:none;padding:0}
.detail-back:hover{color:var(--violet-dark)}
.detail-back svg{width:13px;height:13px}
.info-line{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 6px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.info-line:last-child{border-bottom:none}
.info-line .k{color:var(--muted);flex-shrink:0}
.info-line .v{color:var(--ink);font-weight:600;text-align:right;min-width:0;word-break:break-word}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.status-text{font-size:12px;font-weight:600;white-space:nowrap}
.cat-pill{display:inline-flex;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.cat-private{background:var(--violet-tint);color:var(--violet-dark)}
.cat-nbrc{background:var(--green-tint);color:var(--green)}
.cat-state{background:var(--slate-tint);color:var(--slate)}
.cat-tmr{background:var(--amber-tint);color:var(--amber)}
.cat-other{background:var(--line-soft);color:var(--muted)}
.gauge{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.gauge-track{position:relative;width:120px;height:8px;background:#E4E4E7;border-radius:4px}
.gauge-fill{position:absolute;left:0;top:0;height:8px;border-radius:4px}
/* over limit: solid red bar + hatched red end cap (same as the Power Apps SVG) */
.gauge-track.over{background:transparent}
.gauge-track.over .gauge-solid{position:absolute;left:0;top:0;height:8px;width:calc(100% - 18px);background:#DC2626;border-radius:4px}
.gauge-track.over .gauge-hatch{position:absolute;right:2px;top:0;height:8px;width:16px;border-radius:0 4px 4px 0;
  background:repeating-linear-gradient(-55deg,#DC2626 0 1.9px,transparent 1.9px 3.2px)}
.gauge-val{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;min-width:64px;text-align:right}
.cell-muted{color:var(--muted);font-weight:400}
.issue{color:var(--red)}
.coords{font-size:11px;color:var(--muted);padding:10px 6px 0}
.detail-actions{display:flex;flex-direction:column;gap:10px;padding:16px 6px 6px}
.act-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;background:#fff;border:1px solid #E4E4E7;border-radius:10px;
  font-size:14px;font-weight:600;color:#3F3F46;transition:background .12s,border-color .12s}
.act-btn:hover{background:#FAFAFA;border-color:#D4D4D8}
.act-btn:active{background:#F4F4F5}
.act-btn svg{width:18px;height:18px;flex-shrink:0}
.act-btn.sent{border-color:#A1A1AA}

/* ============ DARK MODE ============ */
body.dark{
  --ink:#E8EAED;--ink-soft:#C3C8D2;--muted:#9AA0AA;--faint:#6B7280;
  --line:rgba(255,255,255,.12);--line-soft:rgba(255,255,255,.06);--bg:#15171C;--card:#1C1F26;
  --violet-tint:rgba(129,104,180,.18);--violet-dark:#B9A5E0;
  --green-tint:rgba(37,134,90,.2);--amber-tint:rgba(217,140,31,.18);--red-tint:rgba(194,69,69,.2);--slate-tint:rgba(59,78,122,.3);--slate:#A9B8D8;
  color-scheme:dark;
}
body.dark .style-toggle,body.dark .ctrl-group,body.dark .ctrl-group button{background:#262A33}
body.dark .ctrl-group button{color:var(--ink)}
body.dark .map-caption{background:rgba(28,31,38,.85)}
body.dark #mapLoader{background:rgba(21,23,28,.9)}

/* Narrow iframe: stack */
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;padding:12px}
  .map-layout{grid-template-columns:1fr}
  .map-wrap{min-height:420px}
  .panel{max-height:520px}
}
</style>
</head>
<body>
<div id="app">
  <div class="map-layout">
    <div class="map-col">
      <div class="map-wrap">
        <div id="azureMap"></div>
        <div class="style-toggle">

          <span class="style-sep"></span>

        </div>
        <div class="map-ctrls">

          <div class="ctrl-group">
            <button onclick="zoomMap(1)" title="Zoom in">+</button>
            <button onclick="zoomMap(-1)" title="Zoom out">−</button>
          </div>
        </div>
        <div class="map-caption" id="mapCaption">Surveyed coordinates from Pit Stock Summaries</div>
        <div id="mapLoader">
          <div class="loader-text" id="loaderText">Loading map…</div>
          <div class="loader-track"><div class="loader-fill"></div></div>
        </div>
      </div>
      <div class="map-legend" id="mapLegend"></div>
    </div>

    <div class="panel" id="sidePanel"></div>
  </div>
</div>

const BUCKETS=[
  {key:'not-started',  label:'Not started',              hex:'#27272A', bg:'#E4E4E7'},
  {key:'in-production',label:'Under Production',         hex:'#A14302', bg:'#FED5B8', pin:'#EE7D1C'},
  {key:'completed',    label:'Completed',                hex:'#214E47', bg:'#D6F1E9'},
  {key:'no-stock',     label:'No more gravel available', hex:'#C24545', bg:'#FBEAEA'},
];
const OTHER_BUCKET={key:'other',label:'Other',hex:'#7A8BA8',bg:'#EEF0F6'};
// pin = colour for map pins, legend and list dots (defaults to the pill text colour)
BUCKETS.concat(OTHER_BUCKET).forEach(b=>{b.pin=b.pin||b.hex;b.color=b.pin;});
function bucketOf(status){
  const s=(status||'').toLowerCase();
  if(!s) return OTHER_BUCKET;
  if(/not\s*started/.test(s)) return BUCKETS[0];
  if(/no\s*(more)?\s*(gravel|stock)|exhaust|depleted/.test(s)) return BUCKETS[3];
  if(/complet/.test(s)) return BUCKETS[2];
  if(/produc|active|open|crushing/.test(s)) return BUCKETS[1];
  return OTHER_BUCKET;
}

/* ── NORMALISE ── tolerant to display-name / logical-name keys from Power Apps */
function normalise(raw,i){
  const g=(...keys)=>{for(const k of keys){const v=raw[k];if(v!==undefined&&v!==null&&v!=='')return v;}return undefined;};
  const num=v=>{if(v===undefined||v===null||v==='')return null;const n=parseFloat(String(v).replace(/[,%\s]/g,''));return isNaN(n)?null:n;};
  const lat=num(g('Latitude','latitude','Lat'));
  const lng=num(g('Longitude','longitude','Lng','Long'));
  const pitId=String(g('Pit_ID','PitID','Pit ID','pitId')??'').trim();
  const name=String(g('Pit_Name','PitName','Pit Name','pitName')??'').trim()||'Unnamed pit';
  const status=String(g('Production_Pit_Status','Production Pit Status','ProductionPitStatus','status')??'').trim();
  return {
    raw,
    key:(pitId||'x')+'|'+name+'|'+i,
    name, pitId,
    locality:String(g('Locality','locality')??'').trim(),
    lat, lng,
    hasGps: lat!==null&&lng!==null&&!(lat===0&&lng===0)&&Math.abs(lat)<=90&&Math.abs(lng)<=180,
    status, bucket:bucketOf(status),
    category:String(g('Category','category')??'').trim(),
    owner:String(g('Owner','owner')??'').trim(),
    ownerIssue:String(g('Owner_Issue','Owner Issue','OwnerIssue','Owner_Issues','ownerIssue')??'').trim(),
    limit:num(g('Extraction_Limit','Extraction Limit','ExtractionLimit','limit')),
    stock:num(g('Stock_Remaining','StockRemaining','Stock Remaining','stock')),
    bestEstimate:num(g('Best_Stock_Estimate','Best_Available_Stock_Estimate','BestStockEstimate','Best Available Stock Estimate (t)')),
    produced:num(g('Total_Produced','TotalProduced','MaterialProduced','Material_Produced','Total Produced')),
    hauled:num(g('Total_Hauled','TotalHauled','Total Hauled')),
    material:String(g('Material_Available','MaterialAvailable','Material Available')??'').trim(),
    compliance:String(g('Compliance','compliance')??'').trim(),
    lastProd:String(g('Last_Production_Date','Last Production Date','LastProductionDate','lastProd')??'').trim(),
  };
}

/* ── HELPERS ── */
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){
  if(!s) return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return +m[3]+' '+MON[+m[2]-1]+' '+m[1];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return +m[1]+' '+MON[+m[2]-1]+' '+m[3];
  const d=new Date(s); return isNaN(d)?s:d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
}
const fmtN=n=>Math.round(n).toLocaleString('en-AU');
function displayName(p){return p.pitId?p.name+' - '+p.pitId:p.name;}
function catClass(c){
  const s=(c||'').toLowerCase();
  if(s.includes('private'))return 'cat-private';
  if(s.includes('nbrc')||s.includes('council'))return 'cat-nbrc';
  if(s.includes('state')||s.includes('daff'))return 'cat-state';
  if(s.includes('tmr'))return 'cat-tmr';
  return 'cat-other';
}
// same thresholds as the Power Apps stock bar
function stockColor(r){return r>=1?'#DC2626':r>=2/3?'#FF7F26':r>=1/3?'#C9A446':'#2A7769';}

/* ── LOAD FROM HASH ── */
function loadFromHash(){
  try{
    const h=window.location.hash; if(!h||h.length<2) return false;
    const p=JSON.parse(decodeURIComponent(h.substring(1)));
    const rows=Array.isArray(p)?p:(p&&Array.isArray(p.pits)?p.pits:(p&&Array.isArray(p.records)?p.records:null));
    if(!rows) return false;
    if(!Array.isArray(p)){ applyTheme(p.theme); if(p.mapKey) AZURE_KEY=String(p.mapKey); }
    setPits(rows);
    return true;
  }catch(e){console.error('[PitMap] loadFromHash:',e);return false;}
}
function setPits(rows){
  pits=rows.map(normalise).sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
  // keep selection if the same pit is still present
  if(selectedKey){
    const prev=selectedKey.split('|').slice(0,2).join('|');
    const hit=pits.find(p=>p.key.startsWith(prev+'|'));
    selectedKey=hit?hit.key:null;
  }
}
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');}

    <div class="info-line"><span class="k">Best available stock estimate</span><span class="v">${p.bestEstimate!==null?fmtN(p.bestEstimate)+' t':'<span class="cell-muted">—</span>'}</span></div>
    <div class="info-line"><span class="k">Total produced</span><span class="v">${p.produced!==null?fmtN(p.produced)+' t':'<span class="cell-muted">—</span>'}</span></div>
    <div class="info-line"><span class="k">Total hauled</span><span class="v">${p.hauled!==null?fmtN(p.hauled)+' t':'<span class="cell-muted">—</span>'}</span></div>
    <div class="info-line"><span class="k">Stock remaining</span><span class="v">${gauge}</span></div>
    <div class="info-line"><span class="k">Last production</span><span class="v">${p.lastProd?esc(fmtDate(p.lastProd)):'<span class="cell-muted">—</span>'}</span></div>
    <div class="coords">${p.hasGps?`📍 ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`:'⚠ No GPS coordinates — not shown on the map'}</div>
    <div class="detail-actions">
      <button class="act-btn" onclick="sendPitAction('VIEW_PIT_REGISTER',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        View in Pit Register
      </button>
      <button class="act-btn" onclick="sendPitAction('VIEW_ATTACHMENTS',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="m9 13 2 2 4-4"/></svg>
        View attachments
      </button>
    </div>
  </div>`;
}

function stockBar(v,limit){
  if(v===null) return '<span class="cell-muted">—</span>';
  const lim=limit||0, ratio=lim>0?v/lim:0, over=lim>0&&v>lim;
  const label=`<span class="gauge-val">${fmtN(v)} t</span>`;
  if(over) return `<div class="gauge"><div class="gauge-track over" title="${fmtN(v)} t of ${fmtN(lim)} t limit"><div class="gauge-solid"></div><div class="gauge-hatch"></div></div>${label}</div>`;
  const W=120, fill=Math.max(8,Math.round(W*Math.min(ratio,1)));
  const bar=ratio>0?`<div class="gauge-fill" style="width:${fill}px;background:${stockColor(ratio)}"></div>`:'';
  return `<div class="gauge"><div class="gauge-track" title="${fmtN(v)} t of ${lim?fmtN(lim)+' t limit':'no limit set'}">${bar}</div>${label}</div>`;
}

function selectPit(key,fly){
  selectedKey=key;
  const p=pits.find(x=>x.key===key);
  renderPanel(); highlightMarkers();
  if(p&&p.hasGps&&fly&&azMap){
    azMap.setCamera({center:[p.lng,p.lat],zoom:Math.max(12,azMap.getCamera().zoom||0),duration:700,type:'fly'});
  }
  if(p) postUp({type:'PIT_SELECTED',pitId:p.pitId,pitName:p.name,locality:p.locality});
}
/* Button → Power Apps. Same envelope as the DRFA map: {type:'TASK_UPDATED', task:{type:..., ...}} */
function sendPitAction(action,btn){
  const p=selectedKey&&pits.find(x=>x.key===selectedKey); if(!p) return;
  postUp({type:'TASK_UPDATED',task:Object.assign({},p.raw,{
    type:action,
    guid:p.pitId,
    pitId:p.pitId,
    pitName:p.name,
    locality:p.locality,
    status:p.status,
    latitude:p.hasGps?p.lat:null,
    longitude:p.hasGps?p.lng:null
  })});
  if(btn){btn.classList.add('sent');setTimeout(()=>btn.classList.remove('sent'),600);}
}
function clearSelection(){
  selectedKey=null; renderPanel(); highlightMarkers();
  postUp({type:'PIT_SELECTED',pitId:'',pitName:'',locality:''});
}

/* ── MAP ── */
function showLoader(t){const el=document.getElementById('mapLoader');document.getElementById('loaderText').textContent=t||'Loading map…';el.classList.remove('hidden');}
function hideLoader(){document.getElementById('mapLoader').classList.add('hidden');}

function initMap(){
  if(azMap||!AZURE_KEY||typeof atlas==='undefined') return;
  showLoader('Loading map…');
  document.querySelector('#mapLoader .loader-track').style.display='';
  azMap=new atlas.Map('azureMap',{
    center:DEFAULT_CENTER,zoom:DEFAULT_ZOOM,style:'satellite_road_labels',language:'en-AU',
    authOptions:{authType:'subscriptionKey',subscriptionKey:AZURE_KEY},
    renderWorldCopies:false,showLogo:false,showFeedbackLink:false
  });
  azMap.events.add('ready',()=>{mapReady=true;hideLoader();addBoundary();renderMarkers();});
}
function setMapStyle(mode){
  if(!azMap)return;
  azMap.setStyle({style:mode==='satellite'?'satellite_road_labels':'road'});
  document.getElementById('btnRoad').classList.toggle('active',mode==='road');
  document.getElementById('btnSat').classList.toggle('active',mode==='satellite');
}
function zoomMap(d){if(!azMap)return;const z=azMap.getCamera().zoom||DEFAULT_ZOOM;azMap.setCamera({zoom:Math.max(3,Math.min(19,z+d)),duration:250,type:'ease'});}

function addBoundary(){
  const src=new atlas.source.DataSource();
  azMap.sources.add(src);
  src.add(new atlas.data.Feature(new atlas.data.Polygon([NB_BOUNDARY]),{name:'North Burnett'}));
  boundaryLayers=[
    new atlas.layer.PolygonLayer(src,null,{fillColor:'#E8621A',fillOpacity:0.14}),
    new atlas.layer.LineLayer(src,null,{strokeColor:'#E8621A',strokeWidth:3,lineJoin:'round'})
  ];
  boundaryLayers.forEach(l=>azMap.layers.add(l));
  applyBoundaryVisibility();
}
function applyBoundaryVisibility(){
  boundaryLayers.forEach(l=>l.setOptions({visible:showBoundary}));
  document.getElementById('btnBoundary').classList.toggle('active',showBoundary);
}
function toggleBoundary(){showBoundary=!showBoundary;if(boundaryLayers.length)applyBoundaryVisibility();else document.getElementById('btnBoundary').classList.toggle('active',showBoundary);}

function renderMarkers(){
  if(!mapReady)return;
  markers.forEach(m=>azMap.markers.remove(m.marker)); markers=[];
  visiblePits().filter(p=>p.hasGps).forEach(p=>{
    const marker=new atlas.HtmlMarker({
      htmlContent:`<div class="pin-host"><div class="pin" style="background:${p.bucket.pin}"></div><div class="pin-label">${esc(displayName(p))}</div></div>`,
      position:[p.lng,p.lat],anchor:'center'
    });
    azMap.markers.add(marker);
    azMap.events.add('click',marker,()=>selectPit(p.key,false));
    markers.push({marker,key:p.key});
  });
  highlightMarkers();
  if(firstFit){firstFit=false;fitAll(true);}
}
function highlightMarkers(){
  markers.forEach(m=>{
    const el=m.marker.getElement(); if(!el)return;
    const on=m.key===selectedKey;
    const host=el.querySelector('.pin-host'), pin=el.querySelector('.pin');
    if(host) host.classList.toggle('is-selected',on);
    if(pin) pin.classList.toggle('selected',on);
    el.style.zIndex=on?'5':'';
  });
}
function fitAll(instant){
  if(!azMap)return;
  const pts=visiblePits().filter(p=>p.hasGps).map(p=>[p.lng,p.lat]);
  if(!pts.length){azMap.setCamera({center:DEFAULT_CENTER,zoom:DEFAULT_ZOOM,duration:instant?0:500,type:'ease'});return;}
  if(pts.length===1){azMap.setCamera({center:pts[0],zoom:13,duration:instant?0:500,type:'ease'});return;}
  azMap.setCamera({bounds:atlas.data.BoundingBox.fromPositions(pts),padding:60,maxZoom:14,duration:instant?0:500,type:'ease'});
}

/* ── RENDER ALL ── */
function renderAll(refit){
  if(selectedKey&&!pits.some(p=>p.key===selectedKey)) selectedKey=null;
  renderPanel(); renderMarkers();
  if(refit&&mapReady) fitAll();
}

/* ── postMessage → Power Apps ── */
function postUp(obj){
  try{
    const msg=JSON.stringify(Object.assign({},obj,{_ts:Date.now()}));
    window.parent.postMessage(msg,'*');
    try{sessionStorage.setItem('gravel_pitmap_message',msg);sessionStorage.setItem('drfa_map_message',msg);}catch(e){}
    try{if(window.top&&window.top!==window.parent)window.top.postMessage(msg,'*');}catch(e){}
  }catch(e){}
}

/* ── LISTENERS ── */
window.addEventListener('hashchange',()=>{if(loadFromHash()){renderAll(true);initMap();}});
window.addEventListener('message',e=>{
  try{
    const m=typeof e.data==='string'?JSON.parse(e.data):e.data;
    if(!m||!m.type)return;
    if(m.type==='REFRESH_DATA'&&Array.isArray(m.pits)){setPits(m.pits);renderAll(false);}
    if(m.type==='SET_THEME') applyTheme(m.theme);
    if(m.type==='SET_MAP_KEY'&&m.mapKey){AZURE_KEY=String(m.mapKey);initMap();}
    if(m.type==='SELECT_PIT'&&m.pitId!==undefined){
      const p=pits.find(x=>x.pitId===String(m.pitId));
      if(p) selectPit(p.key,true);
    }
  }catch(err){}
});

/* ── BOOT ── */
if(!loadFromHash()){
  console.warn('[PitMap] No hash payload — showing demo data.');
  setPits(DEMO);
  document.getElementById('mapCaption').textContent='Demo data — no payload received from Power Apps';
}
renderLegend(); renderPanel();
postUp({type:'READY'});
let _tries=0;
const _boot=setInterval(()=>{
  _tries++;
  if(typeof atlas!=='undefined'){
    clearInterval(_boot);
    if(AZURE_KEY) initMap();
    else{showLoader('Map key not provided — pass mapKey from Power Apps');document.querySelector('#mapLoader .loader-track').style.display='none';}
  }
  else if(_tries>120){clearInterval(_boot);showLoader('Map unavailable — check network settings');document.querySelector('#mapLoader .loader-track').style.display='none';}
},50);
</script>
